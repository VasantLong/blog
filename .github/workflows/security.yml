name: Security checks

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 22 * * *' # 每天 22:17 UTC = 次日 06:17 北京时间
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-checks
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Hugo (extended)
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: '0.168.0'
          extended: true

      - name: Build
        run: hugo --minify --gc

      - name: Security invariants
        run: bash scripts/security-check.sh
