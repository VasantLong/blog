{{- /* 界面语言层引导：首帧前定 data-ui-lang，避免英文偏好下先闪中文；双语页脚按属性显隐 */ -}}
<style>
  html:not([data-ui-lang="en"]) [data-ui-en] {
    display: none;
  }
  html[data-ui-lang="en"] [data-ui-zh] {
    display: none;
  }
  /* 站点级排版：Blowfish 的 Tailwind 只扫主题源码，站点 layouts/partials 里新写的 utility
     class 不会进产物（gap-x-4 / gap-y-1 / ms-1 / p-0.5 / sm:justify-end 在 main.bundle.min.*.css
     里都数不出来），所以站点自有排版一律写原生 CSS，随这段内联 <style> 永远生效。 */
  .site-footer-links {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.375rem 1rem;
  }
  @media (min-width: 640px) {
    .site-footer-links {
      justify-content: flex-end;
    }
  }
  .ui-lang-switch {
    margin-inline-start: 0.5rem;
    padding: 0.125rem;
  }
  .ui-lang-switch button {
    padding: 0 0.4rem;
    line-height: 1.5rem;
    border-radius: 0.375rem;
    color: inherit;
    opacity: 0.55;
  }
  .ui-lang-switch button[aria-pressed="true"] {
    opacity: 1;
    font-weight: 600;
    background-color: rgb(127 127 127 / 0.18);
  }
</style>
<script>
  (function () {
    var lang = "zh";
    try {
      if (localStorage.getItem("uiLang") === "en") lang = "en";
    } catch (e) {}
    document.documentElement.setAttribute("data-ui-lang", lang);
  })();
</script>
