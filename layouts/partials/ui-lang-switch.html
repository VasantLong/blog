{{- /* 界面语言切换器（顶栏）：只写 localStorage，不产生第二套 URL */ -}}
<div
  class="ui-lang-switch flex items-center rounded-lg border bf-border-color bg-neutral-100/50 text-xs dark:bg-neutral-800/50"
  role="group"
  aria-label="界面语言 / Interface language"

</div>
